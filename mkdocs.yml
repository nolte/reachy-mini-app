site_name: reachy-mini-app
site_description: Reachy Mini behavior package built on the Pollen Robotics / Hugging Face reachy_mini SDK.
site_url: https://nolte.github.io/reachy-mini-app/
repo_url: https://github.com/nolte/reachy-mini-app
repo_name: nolte/reachy-mini-app
edit_uri: edit/develop/docs/

docs_dir: docs

theme:
  name: material
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - toc:
      permalink: true

nav:
  - Home: index.md
