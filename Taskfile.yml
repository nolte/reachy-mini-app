version: '3'

tasks:
  setup:
    desc: Install dev and docs dependencies, register pre-commit hooks
    cmds:
      - pip install -e ".[dev,docs]"
      - pre-commit install

  lint:
    desc: Run linters (Ruff lint + format check)
    cmds:
      - ruff check .
      - ruff format --check .

  test:
    desc: Run the pytest suite
    cmds:
      - pytest

  docs:
    desc: Build the MkDocs documentation
    cmds:
      - mkdocs build --strict

  check:
    desc: Run lint + test + docs in sequence (CI parity)
    cmds:
      - task: lint
      - task: test
      - task: docs
