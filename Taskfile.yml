version: '3'

tasks:
  setup:
    desc: Install runtime, dev, and docs dependencies into the active venv, register pre-commit hooks
    cmds:
      - pip install -e .
      - pip install -r requirements-dev.txt
      - pip install -r docs/requirements.txt
      - pre-commit install

  lint:
    desc: Run linters (Ruff lint + format check)
    cmds:
      - ruff check .
      - ruff format --check .

  test:
    desc: Run the pytest suite
    cmds:
      - pytest

  docs:
    desc: Build the MkDocs documentation
    cmds:
      - mkdocs build --strict

  check:
    desc: Run lint + test + docs in sequence (CI parity)
    cmds:
      - task: lint
      - task: test
      - task: docs
