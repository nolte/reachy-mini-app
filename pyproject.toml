[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "reachy-mini-app"
version = "0.0.1"
description = "Reachy Mini behavior package built on the Pollen Robotics / Hugging Face reachy_mini SDK."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "reachy-mini-app contributors" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "pre-commit>=4",
]
docs = [
    "mkdocs-material>=9.5,<10",
]

[project.urls]
Homepage = "https://github.com/nolte/reachy-mini-app"
Repository = "https://github.com/nolte/reachy-mini-app"
Documentation = "https://nolte.github.io/reachy-mini-app/"
Issues = "https://github.com/nolte/reachy-mini-app/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
