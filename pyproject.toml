[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "reachy-mini-app"
version = "0.0.1"
description = "Reachy Mini behavior package built on the Pollen Robotics / Hugging Face reachy_mini SDK."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "reachy-mini-app contributors" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

# Install sets live in `requirements.txt`, `requirements-dev.txt`, and
# `docs/requirements.txt` instead of `[project.optional-dependencies]`,
# per spec/project/project-structure: pyproject.toml carries distribution
# metadata and tooling configuration only; requirements*.txt files own the
# install sets.

[project.urls]
Homepage = "https://github.com/nolte/reachy-mini-app"
Repository = "https://github.com/nolte/reachy-mini-app"
Documentation = "https://nolte.github.io/reachy-mini-app/"
Issues = "https://github.com/nolte/reachy-mini-app/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
